name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install mkdocs-material

      # Package each skill folder into a downloadable .skill file
      - name: Build .skill downloads
        run: |
          mkdir -p docs/skills/downloads
          cd skills
          for d in */; do
            name="${d%/}"
            (cd "$name" && zip -r "../../docs/skills/downloads/${name}.skill" .)
          done

      - run: mkdocs gh-deploy --force
